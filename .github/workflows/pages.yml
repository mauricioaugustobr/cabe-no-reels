name: Deploy to GitHub Pages

# Publicação manual (opcional). O caminho mais simples é servir o site direto do
# branch: Settings > Pages > Source: Deploy from a branch > main / (root).
# Se preferir publicar pelo Actions, escolha "GitHub Actions" em Settings > Pages
# e rode este workflow em Actions > Deploy to GitHub Pages > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar só o site
        run: |
          mkdir -p _site
          cp index.html app.js _site/

      - name: Subir o pacote
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
